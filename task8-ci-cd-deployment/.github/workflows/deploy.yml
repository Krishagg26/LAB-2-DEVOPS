name: CI/CD Pipeline - Kubernetes Deployment

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Verify Kubernetes Manifests
      run: |
        echo "Verifying deployment manifests..."
        kubectl apply --dry-run=client -f task8-ci-cd-deployment/manifests/deployment.yaml
